name: Sync Fork Upstream
on:
  schedule:
    - cron: '0 2 * * *' # Checks for updates once every day at midnight
  workflow_dispatch: # Allows you to manually trigger it via the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync GitHub Fork
        run: |
          git remote add upstream https://github.com
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit || echo "Conflicts found or already up to date"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
