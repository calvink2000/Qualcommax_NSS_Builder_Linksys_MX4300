name: Sync Fork Upstream
on:
  schedule:
    - cron: '0 3 * * *'  # Checks for updates once every day at 3 AM UTC
  workflow_dispatch:  # Allows you to manually trigger it via the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Sync GitHub Fork (safe)
        run: |
          set -euxo pipefail

          # Ensure we can (re)create the upstream remote safely
          git remote remove upstream || true
          git remote add upstream https://github.com/JuliusBairaktaris/Qualcommax_NSS_Builder.git

          # Fetch full history, tags, and prune any stale refs
          git fetch upstream --prune --tags

          # Ensure we're on the branch we want to update
          git checkout main

          # Merge upstream/main preferring upstream changes when conflicts occur
          git merge --no-edit -X theirs upstream/main || echo "No changes to merge"

          # Backup upstream README and re-apply your local modifications
          cp README.md JULIUS_README.md || true
          sed -i 's/DEVICE_PROFILE: .*/DEVICE_PROFILE: linksys_mx4300/g' .github/workflows/build.yaml || true
          sed -i 's/cron: .*/cron: "0 3 1,15 * *"/g' .github/workflows/build.yaml || true
          cp LINKSYS_README.md README.md

          # Commit and push only if there are changes
          git add .github/workflows/build.yaml README.md JULIUS_README.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sync from upstream"
            git push origin main
          fi
